name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to repair with an Android build
        required: true
        type: string
      publish_to_zapstore:
        description: Also broadcast this release to Zapstore relays
        required: false
        type: boolean
        default: false
      export_keystore:
        description: "One-off: upload the Android signing keystore, encrypted, as a build artifact"
        required: false
        type: boolean
        default: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-22.04
    steps:
      - name: Create release entry
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Scrollstr ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          draft: false
          prerelease: false

  desktop:
    needs: release
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - platform: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
          - platform: windows-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Install dependencies
        run: bash scripts/ci-install-dependencies.sh

      - name: Build frontend
        run: npm run build:tauri

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Scrollstr ${{ env.RELEASE_TAG }}

  android:
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$HOME/Android/Sdk
          mkdir -p "$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -qo cmdline-tools.zip
          mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" > /dev/null 2>&1

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - name: Install dependencies
        run: bash scripts/ci-install-dependencies.sh

      - name: Build frontend
        run: npm run build:tauri

      - name: Init Android project
        run: npx tauri android init

      - name: Set up Android signing
        run: |
          base64 -d <<< "$ANDROID_KEYSTORE_BASE64" > "$RUNNER_TEMP/release.keystore"
          cat > src-tauri/gen/android/keystore.properties <<PROPS
          password=$ANDROID_KEYSTORE_PASSWORD
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$RUNNER_TEMP/release.keystore
          PROPS
          python3 - <<'PY'
          path = "src-tauri/gen/android/app/build.gradle.kts"
          content = open(path).read()

          signing_block = '''
              signingConfigs {
                  create("release") {
                      val keystorePropertiesFile = rootProject.file("keystore.properties")
                      val keystoreProperties = Properties()
                      if (keystorePropertiesFile.exists()) {
                          keystoreProperties.load(keystorePropertiesFile.inputStream())
                      }
                      if (keystoreProperties.containsKey("storeFile")) {
                          storeFile = file(keystoreProperties["storeFile"] as String)
                          storePassword = keystoreProperties["storePassword"] as String
                          keyAlias = keystoreProperties["keyAlias"] as String
                          keyPassword = keystoreProperties["keyPassword"] as String
                      }
                  }
              }
          '''

          assert "    buildTypes {" in content, "buildTypes block not found in build.gradle.kts"
          content = content.replace("    buildTypes {", signing_block + "    buildTypes {", 1)

          release_marker = 'getByName("release") {\n            isMinifyEnabled = true'
          assert release_marker in content, "release buildType not found in build.gradle.kts"
          content = content.replace(
              release_marker,
              'getByName("release") {\n            signingConfig = signingConfigs.getByName("release")\n            isMinifyEnabled = true',
          )

          open(path, "w").write(content)
          PY
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      # One-off export so a human can run the zsp identity wizard locally
      # (it requires the actual keystore file and refuses to run
      # non-interactively). Encrypted because this repo is public and
      # workflow artifacts on public repos are downloadable by anyone with
      # a GitHub account, not just collaborators.
      - name: Export encrypted keystore artifact
        if: github.event_name == 'workflow_dispatch' && inputs.export_keystore == true
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in "$RUNNER_TEMP/release.keystore" \
            -out "$RUNNER_TEMP/release.keystore.enc" \
            -pass env:KEYSTORE_EXPORT_PASSPHRASE
        env:
          KEYSTORE_EXPORT_PASSPHRASE: ${{ secrets.KEYSTORE_EXPORT_PASSPHRASE }}

      - name: Upload encrypted keystore artifact
        if: github.event_name == 'workflow_dispatch' && inputs.export_keystore == true
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-encrypted
          path: ${{ runner.temp }}/release.keystore.enc
          retention-days: 1

      - name: Build Android release
        run: |
          export ANDROID_HOME=$HOME/Android/Sdk
          unset ANDROID_SDK_ROOT
          npx tauri android build

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          fail_on_unmatched_files: true

      - name: Install zsp
        run: go install github.com/zapstore/zsp/cmd/zsp@latest

      - name: Validate Zapstore config
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          zsp publish --check zapstore.yaml

      # Broadcasts to Nostr relays on a real tag push, or on a
      # workflow_dispatch repair run when explicitly opted in via
      # publish_to_zapstore, so repairing an old tag never re-announces a
      # release unless that's asked for.
      - name: Publish to Zapstore
        if: github.event_name == 'push' || inputs.publish_to_zapstore == true
        env:
          SIGN_WITH: ${{ secrets.ZAPSTORE_NSEC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          zsp publish --quiet --skip-preview zapstore.yaml

  ios:
    needs: release
    if: github.event_name == 'push'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - name: Add iOS target
        run: rustup target add aarch64-apple-ios-sim

      - name: Install dependencies
        run: bash scripts/ci-install-dependencies.sh

      - name: Build frontend
        run: npm run build:tauri

      - name: Init iOS project
        run: npx tauri ios init

      - name: Build unsigned iOS simulator app
        run: npx tauri ios build --debug --target aarch64-sim
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

      - name: Package iOS simulator app
        run: |
          app_path="$(find src-tauri/gen/apple/build -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" scrollstr-ios-simulator.zip

      - name: Upload iOS simulator app to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: scrollstr-ios-simulator.zip
