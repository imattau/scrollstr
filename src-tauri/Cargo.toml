[package]
name = "scrollstr"
version = "0.1.0"
description = "Consumption-first Nostr vertical short-form video client"
authors = ["scrollstr"]
license = "MIT"
repository = "https://github.com/scrollstr/scrollstr"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
nostr-sdk = "0.39"
hex = "0.4"
